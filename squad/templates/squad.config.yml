# squad configuration. Copied to .squad/config.yml by the setup skill.
owner: OWNER                      # GitHub user or organization
repo: REPO
project_number: null              # filled in by setup
ids:                              # filled in by setup; do not edit by hand
  project_id: null
stack: ""                         # e.g. "Node 20, Next.js 14, PostgreSQL + Prisma, Vitest, Playwright";
                                  # empty in a new repo: the Team Lead proposes one, the stakeholder decides
language:
  artifacts: en                   # fixed: every document, issue and PR is in English
  chat: auto                      # reply to the stakeholder in their language (vi/en)
commands:
  install: npm ci
  test: npm test
  lint: npm run lint
  e2e: ""                         # e.g. npx playwright test; leave empty if none
parallel:
  max_parallel_dev: 2
  max_open_prs: 4
  port_base: 4100
  test_db_prefix: app_test
merge:
  require_ci: true                # Team Lead merges only with green CI checks
deploy:
  platform: railway
  staging_workflow: deploy.yml
  staging_url: https://staging.example.com
  production_environment: production   # GitHub Environment with required reviewers
limits:
  max_attempts: 3
  story_max_ac: 5
  story_max_tasks: 5
  pr_max_lines: { XS: 50, S: 150, M: 300 }
  pr_max_files: { XS: 3, S: 6, M: 10 }
  pr_size_exclude: ["**/*.test.*", "**/__tests__/**", "**/*.lock", "package-lock.json", "**/generated/**"]
